server:
  port: 51601
spring:
  application:
    name: leadnews-app-gateway
  config:
    import: "consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        prefer-ip-address: true
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            corsConfigurations:
              '[/**]':
                allowedHeaders: "*"
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - DELETE
                  - PUT
                  - OPTIONS
          routes:
            - id: legacy-user-follow
              uri: lb://leadnews-behavior
              predicates:
                - Path=/user/api/v1/user/user_follow
                - Method=POST
              filters:
                - SetPath=/api/v1/user/user_follow
            - id: user
              uri: lb://leadnews-user
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1
            - id: article
              uri: lb://leadnews-article
              predicates:
                - Path=/article/**
              filters:
                - StripPrefix=1
            - id: search
              uri: lb://leadnews-search
              predicates:
                - Path=/search/**
              filters:
                - StripPrefix=1
            - id: behavior
              uri: lb://leadnews-behavior
              predicates:
                - Path=/behavior/**
              filters:
                - StripPrefix=1
