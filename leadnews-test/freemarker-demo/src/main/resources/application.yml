server:
  port: 8881
spring:
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        prefer-ip-address: true
  config:
    import: "consul:"
  application:
    name: test-freemarker
  freemarker:
    cache: false
    settings:
      template_update_delay: 0
    suffix: .ftl
    template-loader-path: classpath:/templates