services:
  consul:
    image: hashicorp/consul:1.15
    container_name: leadnews-consul
    ports:
      - "8500:8500"
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    restart: unless-stopped

  redis:
    image: redis:6.2-alpine
    container_name: leadnews-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass leadnews
    restart: unless-stopped

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: leadnews-zookeeper
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: leadnews-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: leadnews-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    container_name: leadnews-mongo
    ports:
      - "27017:27017"
    restart: unless-stopped

  minio:
    image: elestio/minio:latest
    container_name: leadnews-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  elasticsearch-data:
